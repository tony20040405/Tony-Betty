.fx{position:fixed;top:-30px;pointer-events:none;animation:fall 2.6s linear forwards;z-index:9}

#toast.show{opacity:1;transform:translate(-50%,0)}
.wheelbox{position:relative;width:260px;margin:10px auto}
.ptr{position:absolute;top:-8px;left:50%;margin-left:-11px;border:11px solid transparent;border-top:22px solid var(--accent);z-index:2}
#wc{position:relative;inset:auto;display:block;cursor:default;width:260px;height:260px;border-radius:50%;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}

let AC = null, muted = false;
function beep(f,t,d,type="sine",v=.08){
  if(!AC||muted) return; const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime+t;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n+d);
}
const chime = r => TIER[r].s.forEach((f,i)=>beep(f,i*.11,.5,"triangle",.1));
$("snd").onclick = () => { muted = !muted; $("snd").textContent = muted ? "🔇" : "🔊"; };

/* ---------- 版面資訊 ---------- */
function chips(){
  const c = []; const t = todayD();
  if(cfg.startDate){ const d = Math.floor((t - day0(cfg.startDate))/864e5); if(d>=0) c.push(`💞 在一起 <b>${d}</b> 天`); }
  if(cfg.anniversary){ const d = Math.round((day0(cfg.anniversary) - t)/864e5);
    c.push(d>0 ? `🎂 一週年倒數 <b>${d}</b> 天` : d===0 ? `🎉 <b>今天是紀念日!</b>` : ""); }
  if(ST.streak.n>1) c.push(`🔥 連續 <b>${ST.streak.n}</b> 天`);
  if(cfg.dailyLimit>0) c.push(`🎟️ 今日剩 <b>${left()}</b> 張`);
  $("chips").innerHTML = c.filter(Boolean).map(x=>`<span class="chip">${x}</span>`).join("");
}
const left = () => cfg.dailyLimit>0 ? Math.max(0,cfg.dailyLimit+(ST.bonus.d===tk()?ST.bonus.n:0)-(ST.days[tk()]||0)) : Infinity;
function applyText(){
  $("title").textContent = cfg.herName ? `💖 給${cfg.herName}的專屬刮刮樂` : cfg.title;
  $("sub").textContent = cfg.subtitle; chips();
}
function colGrid(){
  const g = $("grid"); g.textContent = ""; let have = 0;
  allList().forEach(p => {
    const rec = ST.got[p.t], T = TIER[p.r]||TIER.N, it = document.createElement("div");
    it.className = "it" + (rec?"":" lock"); it.style.setProperty("--c",T.c);
    if(rec){ have++; const rest = rec.n-(rec.u||0);
      it.innerHTML = `<div class="e"></div><b></b><small>${T.n} ・ 持有 ${rest} 張</small>`;
      it.children[0].textContent = p.e; it.children[1].textContent = p.t;
      const b = document.createElement("button"); b.textContent = rest>0 ? "兌換" : "已用完"; b.disabled = rest<=0;
      b.onclick = () => { rec.u = (rec.u||0)+1; save(); colGrid(); share(p); }; it.appendChild(b);
    } else it.innerHTML = `<div class="e">❓</div><b>???</b><small>${T.n}</small>`;
    g.appendChild(it);
  });
  $("prog").textContent = `${have}/${allList().length}`; renderAch();
}
$("colBtn").onclick = () => { $("col").hidden = !$("col").hidden; if(!$("col").hidden){ colGrid(); $("col").scrollIntoView({behavior:"smooth"}); } };

/* ---------- 刮刮卡 ---------- */
const cv = $("cv"), ctx = cv.getContext("2d"), wrap = $("wrap"), nextBtn = $("next"), info = $("info");
let drawing = false, revealed = false, last = null, moves = 0, cur = null, count = 0, lastNoise = 0;
function pick(){
  if(cfg.anniversary && Math.abs(Math.round((day0(cfg.anniversary)-todayD())/864e5))<=1 && !ST.sp[cfg.anniversary]) return specialObj();
  if(cfg.letter && Math.random()<.04) return letterObj();
  let pool = cfg.prizes.filter(p=>p.t && Number(p.w)>0);
  const rc = ST.recent||[], fresh = pool.filter(p=>!rc.includes(p.t)); if(fresh.length) pool = fresh;
  if(ST.miss>=4){ const hi = pool.filter(p=>p.r!=="N"); if(hi.length) pool = hi; }
  let r = Math.random()*pool.reduce((s,p)=>s+Number(p.w),0);
  for(const p of pool){ r -= Number(p.w); if(r<=0) return p; } return pool[pool.length-1];
}
function paint(){
  const r = wrap.getBoundingClientRect(), d = window.devicePixelRatio||1;
  cv.width = r.width*d; cv.height = r.height*d; ctx.setTransform(d,0,0,d,0,0); ctx.globalCompositeOperation = "source-over";
  const g = ctx.createLinearGradient(0,0,r.width,r.height);
  g.addColorStop(0,"#c3c7d0"); g.addColorStop(.35,"#f4f5f8"); g.addColorStop(.6,"#c9ccd5"); g.addColorStop(1,"#eceef2");
  ctx.fillStyle = g; ctx.fillRect(0,0,r.width,r.height);
  ctx.fillStyle = "rgba(255,255,255,.55)";
  for(let i=0;i<70;i++){ ctx.fillRect(Math.random()*r.width,Math.random()*r.height,2,2); }
  ctx.fillStyle = "rgba(120,125,140,.6)"; ctx.font = "700 20px system-ui,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("✨ 刮一刮 ✨", r.width/2, r.height/2-8);
  ctx.font = "13px system-ui,sans-serif"; ctx.fillText("今天會抽到什麼呢?", r.width/2, r.height/2+18);
}
function newCard(){
  wrap.classList.remove("win"); revealed = false; moves = 0;
  cv.style.transition = "none"; cv.classList.remove("done"); paint(); void cv.offsetWidth; cv.style.transition = "";
  if(left()<=0){
    $("bd").textContent = "休息中"; wrap.style.setProperty("--tc","#9b6b7d");
    $("pe").textContent = "🌙"; $("pt").textContent = "今天的刮刮樂用完囉"; $("pn").textContent = "明天再來,會有新的驚喜";
    cv.classList.add("done"); nextBtn.disabled = true; info.textContent = "好好休息,明天見 💤"; chips(); return;
  }
  cur = findDef(ST.pending) || pick(); ST.pending = cur.t; save();
  const T = TIER[cur.r]||TIER.N;
  wrap.style.setProperty("--tc",T.c); $("bd").textContent = T.n;
  $("pe").textContent = cur.e||"🎁"; $("pt").textContent = cur.t; $("pn").textContent = (cur.n||"") + (cfg.fromName?` — ${cfg.fromName}`:"");
  nextBtn.disabled = true; info.textContent = count ? `這次已刮 ${count} 張` : "用手指刮開看看 👆"; chips();
}
const pos = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
function spark(p){
  const s = document.createElement("span"); s.className = "sp"; s.textContent = ["✨","💖","⭐","✦"][Math.random()*4|0];
  s.style.left = p.x+"px"; s.style.top = p.y+"px"; s.style.setProperty("--dx",(Math.random()*50-25)+"px"); s.style.setProperty("--dy",(Math.random()*-50-10)+"px");
  wrap.appendChild(s); setTimeout(()=>s.remove(),750);
}
function scratch(e){
  if(!drawing||revealed) return; const p = pos(e);
  ctx.globalCompositeOperation = "destination-out"; ctx.lineWidth = 36; ctx.lineCap = ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p;
  if(moves%3===0) spark(p);
  const now = performance.now(); if(now-lastNoise>70){ lastNoise = now; beep(180+Math.random()*220,0,.05,"sawtooth",.015); }
  if(++moves%6===0) check();
}
function check(){
  const d = ctx.getImageData(0,0,cv.width,cv.height).data; let c = 0, t = 0;
  for(let i=3;i<d.length;i+=64){ t++; if(d[i]<128) c++; }
  if(c/t>=REVEAL_AT) reveal();
}
function reveal(){
  revealed = true; drawing = false; count++; cv.classList.add("done"); wrap.classList.add("win");
  ST.pending = null; ST.days[tk()] = (ST.days[tk()]||0)+1;
  const g = ST.got[cur.t] || (ST.got[cur.t] = {n:0,u:0}); g.n++; save();
  const T = TIER[cur.r]||TIER.N; chime(cur.r||"N"); confetti(T);
  ST.recent = (ST.recent||[]).concat(cur.t).slice(-9);
  if(cur.special) ST.sp[cfg.anniversary] = 1;
  ST.miss = (cur.r==="N" && !cur.letter && !cur.special) ? ST.miss+1 : 0; save(); checkAch();
  if(cur.letter||cur.special||cur.img) setTimeout(()=>showModal(cur),1100);
  info.textContent = `🎉 恭喜抽到【${T.n}】獎品!` + (left()===0?" 今天的卡用完囉":""); nextBtn.disabled = left()<=0; chips();
  if(!$("col").hidden) colGrid();
}
function confetti(T){
  const em = ["💖","✨","🎉","🌸","⭐","💕","🎀"];
  for(let i=0;i<T.k;i++){
    const s = document.createElement("span"); s.className = "fx"; s.textContent = em[i%em.length];
    s.style.left = Math.random()*100+"vw"; s.style.fontSize = (1+Math.random()*1.2)+"rem"; s.style.animationDelay = Math.random()*.7+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),3600);
  }
}
cv.addEventListener("pointerdown",e=>{ if(revealed) return; if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); scratch(e); });
cv.addEventListener("pointermove",scratch);
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{ if(drawing&&!revealed) check(); drawing = false; }));
nextBtn.onclick = newCard;
window.addEventListener("resize",()=>{ if(!revealed&&moves===0&&left()>0) paint(); });

/* ---------- 背景飄浮愛心 ---------- */
setInterval(()=>{
  if(document.hidden) return; const h = document.createElement("span"); h.className = "heart";
  h.textContent = ["💗","💕","🌸","✨","💖"][Math.random()*5|0]; h.style.left = Math.random()*100+"vw";
  h.style.fontSize = (14+Math.random()*18)+"px"; h.style.animationDuration = (8+Math.random()*7)+"s";
  document.body.appendChild(h); setTimeout(()=>h.remove(),16000);
},900);

/* ---------- 後台 ---------- */
if(/[?&]admin\b/.test(location.search)) $("admBtn").hidden = false;
$("admBtn").onclick = () => { $("adm").hidden = !$("adm").hidden; $("json").value = JSON.stringify(cfg,null,1); if(!$("adm").hidden) $("adm").scrollIntoView({behavior:"smooth"}); };
$("saveCfg").onclick = () => {
  try{
    const c = JSON.parse($("json").value);
    if(!Array.isArray(c.prizes)||!c.prizes.length) throw new Error("prizes 不能是空的");
    localStorage.setItem("scCfg",JSON.stringify(c)); cfg = Object.assign(JSON.parse(JSON.stringify(DEFAULT)),c);
    applyText(); if(moves===0){ ST.pending = null; newCard(); } $("st").textContent = "已儲存 ✓";
  }catch(err){ $("st").textContent = "格式錯誤:" + err.message; }
};
$("resetCfg").onclick = () => { localStorage.removeItem("scCfg"); location.reload(); };
$("clrRec").onclick = () => { if(confirm("要清除這支瀏覽器的抽獎紀錄嗎?")){ localStorage.removeItem("sc2"); location.reload(); } };

/* ---------- 新功能 ---------- */
let loginMsg = "", wAng = 0, spinning = false, tt = 0;
const letterObj = () => ({e:"💌",t:"情書卡",n:"有一封信要給妳,點開來看 💌",r:"E",letter:true});
const specialObj = () => ({e:"🎂",t:"紀念日特別卡",n:"今天是我們的日子 💖",r:"L",special:true});
const wlist = () => (cfg.wheel||[]).map(w=>Object.assign({r:"W"},w));
const allList = () => cfg.prizes.concat(wlist());
const findDef = t => allList().concat([letterObj(),specialObj()]).find(p=>p.t===t);
function toast(m){ const e = $("toast"); e.textContent = m; e.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>e.classList.remove("show"),3200); }
function share(p){
  const text = `我要兌換:${p.e} ${p.t} 🎟️`;
  if(navigator.share) navigator.share({text}).catch(()=>{});
  else { try{ navigator.clipboard.writeText(text); toast("已複製兌換訊息,貼給他吧 📋"); }catch(_){ toast(text); } }
}
function showModal(p){
  const txt = p.letter ? cfg.letter : p.special ? cfg.anniversaryNote : (p.n||""), img = p.img || ((p.letter||p.special)&&cfg.photo) || "", im = $("mdI");
  $("mdE").textContent = p.e; $("mdT").textContent = p.t; $("mdN").textContent = txt;
  im.hidden = !img; if(img){ im.src = img; im.onerror = () => im.hidden = true; } $("md").hidden = false;
}
$("mdX").onclick = () => $("md").hidden = true;
const ACH = [
  ["first","🌱","初次刮卡",()=>Object.keys(ST.got).length>0],
  ["leg","👑","傳說降臨",()=>cfg.prizes.some(p=>p.r==="L"&&ST.got[p.t])],
  ["allN","🧸","集滿普通獎",()=>cfg.prizes.filter(p=>p.r==="N").every(p=>ST.got[p.t])],
  ["all","🏆","全圖鑑",()=>allList().every(p=>ST.got[p.t])],
  ["s7","🔥","連續 7 天",()=>ST.streak.n>=7],
  ["spin","🎡","轉盤達人",()=>ST.spins>=5],
  ["let","💌","收到情書",()=>!!ST.got["情書卡"]]
];
function checkAch(){ ACH.forEach(([id,e,n,f])=>{ if(!ST.ach[id] && f()){ ST.ach[id] = 1; save(); toast(`🏅 解鎖成就:${e} ${n}`); } }); }
function renderAch(){ $("ach").innerHTML = ACH.map(([id,e,n])=>`<span class="bdg${ST.ach[id]?"":" off"}">${e} ${n}</span>`).join(""); }
function login(){
  const t = tk(), y = new Date(Date.now()-864e5).toLocaleDateString("sv");
  if(ST.streak.d !== t){
    ST.streak.n = ST.streak.d===y ? ST.streak.n+1 : 1; ST.streak.d = t;
    if(ST.streak.n===3 || ST.streak.n%7===0){ ST.bonus = {d:t,n:(ST.bonus.d===t?ST.bonus.n:0)+1}; loginMsg = `🔥 連續 ${ST.streak.n} 天!今天多送 1 張`; }
    save();
  }
}
const THEMES = ["","night","peach","mint"];
const applyTheme = () => { document.documentElement.dataset.theme = THEMES[ST.theme||0]; };
$("thBtn").onclick = () => { ST.theme = ((ST.theme||0)+1)%THEMES.length; save(); applyTheme(); };

const WCOL = ["#ffd1dc","#ffe9a8","#cde7ff","#d9f5d0","#e6d4ff","#ffd9b8"];
const wheelLeft = () => Math.max(0,(cfg.wheelLimit||1)-(ST.wheel[tk()]||0));
function drawWheel(){
  const x = $("wc").getContext("2d"), L = wlist(), n = L.length||1, g = 2*Math.PI/n; x.clearRect(0,0,300,300);
  L.forEach((w,i)=>{
    x.beginPath(); x.moveTo(150,150); x.arc(150,150,146,-Math.PI/2+i*g,-Math.PI/2+(i+1)*g); x.closePath();
    x.fillStyle = WCOL[i%WCOL.length]; x.fill(); x.strokeStyle = "#fff"; x.lineWidth = 3; x.stroke();
    x.save(); x.translate(150,150); x.rotate(-Math.PI/2+(i+.5)*g); x.font = "30px serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(w.e,100,0); x.restore();
  });
}
function wheelUI(){ $("wl").textContent = `今日可轉 ${wheelLeft()} 次`; $("spin").disabled = spinning || wheelLeft()<=0; }
$("whBtn").onclick = () => { $("wh").hidden = !$("wh").hidden; if(!$("wh").hidden){ drawWheel(); wheelUI(); $("wh").scrollIntoView({behavior:"smooth"}); } };
$("spin").onclick = () => {
  const L = wlist(); if(spinning || wheelLeft()<=0 || !L.length) return;
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} }
  let r = Math.random()*L.reduce((s,w)=>s+Number(w.w||1),0), idx = L.length-1;
  for(let i=0;i<L.length;i++){ r -= Number(L[i].w||1); if(r<=0){ idx = i; break; } }
  const seg = 360/L.length, center = (idx+.5)*seg + (Math.random()-.5)*seg*.6;
  spinning = true; $("wres").textContent = "轉轉轉…"; wheelUI();
  wAng = Math.floor(wAng/360)*360 + 360*5 + (360-center); $("wc").style.transform = `rotate(${wAng}deg)`;
  for(let i=0;i<14;i++) beep(900-i*30,i*.25,.05,"square",.03);
  setTimeout(()=>{ spinning = false; award(L[idx]); },4300);
};
function award(w){
  const g = ST.got[w.t] || (ST.got[w.t] = {n:0,u:0}); g.n++;
  if(w.bonus){ ST.bonus = {d:tk(),n:(ST.bonus.d===tk()?ST.bonus.n:0)+w.bonus}; }
  ST.wheel[tk()] = (ST.wheel[tk()]||0)+1; ST.spins++; save();
  $("wres").textContent = `${w.e} 轉到:${w.t}` + (w.bonus?"(今天多一張刮刮卡!)":""); chime("R"); confetti(TIER.W);
  wheelUI(); chips(); checkAch(); if(!$("col").hidden) colGrid(); if(w.bonus && left()>0 && cv.classList.contains("done")) nextBtn.disabled = false;
}

login(); applyTheme(); applyText(); newCard(); checkAch(); if(loginMsg) setTimeout(()=>toast(loginMsg),600);

if(typeof auth !== 'undefined') {
  auth.onAuthStateChanged(user => {
    if(user) {
      db.collection("userData").doc(user.uid).get().then(doc => {
        if (doc.exists && doc.data().sc2) {
          Object.assign(ST, JSON.parse(doc.data().sc2));
          localStorage.setItem("sc2", doc.data().sc2);
          chips(); if (document.getElementById("col") && !document.getElementById("col").hidden) colGrid(); checkAch(); applyTheme();
        }
      });
    }
  });
}
</script>
</body>

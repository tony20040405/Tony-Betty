h1{font-size:1.75rem;margin:4px 0;}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:20px;}
.timeline { position: relative; max-width: 600px; margin: 0 auto; padding: 20px 0; text-align: left;}
.timeline::after { content: ''; position: absolute; width: 4px; background-color: var(--accent); top: 0; bottom: 0; left: 20px; border-radius: 2px;}
.container { padding: 10px 20px 10px 50px; position: relative; background-color: inherit; width: 100%;}
.container::after { content: '❤️'; position: absolute; width: 24px; height: 24px; left: 10px; background-color: var(--card); border: 3px solid var(--accent); border-radius: 50%; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 10px;}
.content { padding: 16px; background-color: var(--card); position: relative; border-radius: 12px; box-shadow: 0 6px 16px rgba(232,85,122,.2); border: 2px solid var(--line);}
.content h2 { margin: 0 0 8px; font-size: 1.2rem; color: var(--accent);}
.content p { margin: 0; font-size: 0.95rem; line-height: 1.5;}
.date { font-weight: bold; color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; display: block;}

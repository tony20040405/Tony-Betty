<style>
.card{font-size:1.15rem;line-height:1.7;padding:18px;background:rgba(232,85,122,.08);border-left:4px solid var(--accent);border-radius:12px;min-height:80px}
.task{font-size:1.1rem;line-height:1.6;margin:8px 0 14px}
.week{color:var(--muted);font-size:.85rem}
.done{color:var(--accent);font-weight:bold;min-height:1.2em}
</style>
</head>
<body>
<nav>

<h1>🎮 小遊戲與任務</h1>
<p class="sub">定宇不在的時候,陪妳的小東西 💖</p>
<section class="panel">
  <h2>📅 本週任務</h2>
  <div class="week" id="wk"></div>
  <div class="task" id="task">讀取中...</div>
  <button id="finish">我完成了 ✅</button>
  <p class="done" id="doneMsg"></p>
</section>
<section class="panel" style="text-align:center">
  <h2 style="text-align:left">🃏 難過時抽一張</h2>
  <div class="card" id="card">想我了、心情不好的時候,按下面的按鈕。</div>
  <button id="draw" style="margin-top:14px">抽一張 💌</button>
</section>
<script>
(async () => {
  const user = await authReady; if (!user) return;
  const site = await loadSiteConfig();
  const $ = id => document.getElementById(id);
  const [y, m, d] = site.dates.armyStart.split('-').map(Number);
  const weeks = Math.max(0, Math.floor((Date.now() - new Date(y, m - 1, d)) / (7 * 864e5)));
  const list = site.weekly || [], i = weeks % list.length, key = 'w' + weeks;
  $('wk').textContent = '第 ' + (weeks + 1) + ' 週';
  $('task').textContent = list[i] || '好好照顧自己';
  const ref = db.collection('userData').doc(user.uid);
  let done = {};
  try { const s = await ref.get(); done = (s.exists && s.data().weekly) || {}; } catch (e) { console.warn(e); }
  const mark = () => { $('finish').disabled = !!done[key]; $('doneMsg').textContent = done[key] ? '🎉 這週完成了,好棒!' : ''; };
  mark();
  $('finish').onclick = async () => {
    done[key] = true; mark();
    try { await ref.set({ weekly: { [key]: true } }, { merge: true }); } catch (e) { $('doneMsg').textContent = '⚠️ 儲存失敗:' + e.message; }
  };
  const cheer = site.cheer || [];
  $('draw').onclick = () => { $('card').textContent = cheer[Math.floor(Math.random() * cheer.length)] || '我愛妳'; };
})();
</script>
</body>
</html>

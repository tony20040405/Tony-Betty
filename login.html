<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入我們的專屬空間</title>
  
<!-- Firebase Setup -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBL0LoCSkThMXqYoW8nxlIsRt7A6YyObiI",
    authDomain: "tonybetty-354a7.firebaseapp.com",
    projectId: "tonybetty-354a7",
    storageBucket: "tonybetty-354a7.firebasestorage.app",
    messagingSenderId: "890099191965",
    appId: "1:890099191965:web:55e9df1ea918889364c474"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  
  if (!window.location.pathname.endsWith('login.html')) {
    auth.onAuthStateChanged(user => {
      if (!user) window.location.replace('login.html');
    });
  }
</script>

  <style>
    :root{--b1:#ffe3ec;--b2:#ffd0e4;--b3:#e6dcff;--fg:#4a2230;--card:#fff;--accent:#e8557a;--line:#f5cbd8}
    @media (prefers-color-scheme: dark) {
      :root { --b1: #1d1217; --b2: #2a1424; --b3: #1c1631; --fg: #fbe4ea; --card: #2b1b22; --accent: #ff7a9c; --line: #4a2f3a; }
    }
    body { margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; background:linear-gradient(135deg,var(--b1),var(--b2),var(--b3)); font-family:sans-serif; color:var(--fg); background-size:300% 300%; animation:bg 14s ease infinite; padding:20px; }
    @keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
    .box { background:var(--card); padding:30px 24px; border-radius:20px; box-shadow:0 10px 30px rgba(232,85,122,0.2); width:100%; max-width:360px; text-align:center; border:2px solid var(--line); box-sizing: border-box; }
    h1 { font-size:1.5rem; margin-top:0; color:var(--accent); }
    input { width:100%; padding:14px; margin:10px 0; border:2px solid var(--line); border-radius:12px; box-sizing:border-box; font-size:1rem; outline:none; background:var(--b1); color:var(--fg); }
    input:focus { border-color:var(--accent); }
    button { width:100%; background:var(--accent); color:#fff; border:none; padding:14px; border-radius:999px; font-size:1.1rem; font-weight:bold; cursor:pointer; margin-top:14px; transition:0.2s; box-shadow:0 4px 12px rgba(232,85,122,.3); }
    button:active { transform: scale(0.97); }
    .toggle { margin-top:20px; color:var(--accent); cursor:pointer; font-size:0.95rem; font-weight:bold; text-decoration:underline; }
    .sub { font-size:0.85rem; color:gray; margin-top:8px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">登入我們的世界 💖</h1>
    <p class="sub">登入後資料會自動備份，不怕不見！</p>
    <input type="email" id="email" placeholder="信箱 (例如: love@baobi.com)" />
    <input type="password" id="pw" placeholder="密碼 (至少6個字)" />
    <button id="actionBtn" onclick="doAction()">登入進入</button>
    <div class="toggle" id="toggleMode" onclick="toggle()">還沒有帳號？點我註冊</div>
    <p id="err" style="color:#e8557a; font-size:0.9rem; margin-top:14px; font-weight:bold;"></p>
  </div>
  <script>
    let isLogin = true;
    function toggle() {
      isLogin = !isLogin;
      document.getElementById('title').innerText = isLogin ? "登入我們的世界 💖" : "註冊專屬帳號 💖";
      document.getElementById('actionBtn').innerText = isLogin ? "登入進入" : "註冊並登入";
      document.getElementById('toggleMode').innerText = isLogin ? "還沒有帳號？點我註冊" : "已有帳號？點我登入";
      document.getElementById('err').innerText = "";
    }

    function doAction() {
      const email = document.getElementById('email').value;
      const pw = document.getElementById('pw').value;
      document.getElementById('err').innerText = "處理中...";
      if(!email || !pw) {
          document.getElementById('err').innerText = "請輸入信箱與密碼哦！";
          return;
      }

      if (isLogin) {
        auth.signInWithEmailAndPassword(email, pw).then(() => {
          window.location.href = "index.html";
        }).catch(e => { document.getElementById('err').innerText = "登入失敗：" + e.message; });
      } else {
        auth.createUserWithEmailAndPassword(email, pw).then(() => {
          window.location.href = "index.html";
        }).catch(e => { document.getElementById('err').innerText = "註冊失敗：" + e.message; });
      }
    }
    
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = "index.html";
    });
  </script>
</body>
</html>

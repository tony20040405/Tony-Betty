<h1>💬 每日專屬問答</h1>
<p class="sub">像 SumOne 一樣，每天都有一個專屬問題哦！</p>
<div class="panel">
  <div class="q-title"><span>📝</span> <div id="question">今天的問題是...</div></div>
  <div class="ans-box">
    <label>👦 定宇本寶的回答：</label>
    <textarea id="ans-boy" placeholder="定宇請在此輸入..."></textarea>
  </div>
  <div class="ans-box">
    <label>👧 寶鼻小寶的回答：</label>
    <textarea id="ans-girl" placeholder="寶鼻請在此輸入..."></textarea>
  </div>
  <button id="save-btn">儲存今日回憶 💖</button>
</div>
<script>
const questions = [
  "最喜歡對方身上的什麼味道？", "說出對方一個讓你覺得超可愛的小習慣！", "第一次約會時，心裡在想什麼？", "如果對方是一隻動物，你覺得是什麼？", 
  "最喜歡兩個人一起做的哪件事？", "對方做過最讓你感動的一件小事？", "用三個詞形容現在的感情狀態！", "最近一次因為對方心跳加速是什麼時候？"
];
const today = new Date();
const seed = today.getFullYear() * 1000 + today.getMonth() * 100 + today.getDate();
const qIndex = seed % questions.length;
document.getElementById("question").innerText = `Q: ${questions[qIndex]}`;

const dateStr = today.toISOString().split('T')[0];
const docRef = db.collection("daily").doc(dateStr);

if(typeof auth !== 'undefined') {
  auth.onAuthStateChanged(user => {
    if (user) {
      // 即時連線監聽雲端資料
      docRef.onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (document.activeElement !== document.getElementById("ans-boy")) {
              document.getElementById("ans-boy").value = data.boy || "";
          }
          if (document.activeElement !== document.getElementById("ans-girl")) {
              document.getElementById("ans-girl").value = data.girl || "";
          }
        }
      });
    }
  });
}

let timeout;
const autoSave = () => {
   clearTimeout(timeout);
   timeout = setTimeout(() => {
      if(typeof auth !== 'undefined' && auth.currentUser) {
          docRef.set({
             boy: document.getElementById("ans-boy").value,
             girl: document.getElementById("ans-girl").value
          }, { merge: true });
      }
   }, 800);
};

document.getElementById("ans-boy").addEventListener("input", autoSave);
document.getElementById("ans-girl").addEventListener("input", autoSave);

document.getElementById("save-btn").onclick = () => {
  autoSave();
  alert("已經同步到雲端囉！☁️💖");
};
</script>
